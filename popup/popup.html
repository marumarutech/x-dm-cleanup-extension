<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>X cleanup</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>X cleanup</h1>
    <label>
      モード
      <select id="mode">
        <option value="dm">DM 会話削除</option>
        <option value="tweet">ツイート削除（上から）</option>
      </select>
    </label>
    <p id="modeHint" class="hint"></p>
    <label>
      Min delay (ms)
      <input id="minDelay" type="number" min="200" step="50" value="800" />
    </label>
    <label>
      Max delay (ms)
      <input id="maxDelay" type="number" min="200" step="50" value="2000" />
    </label>
    <label>
      <span id="maxDeletesLabel">Max deletes this run</span>
      <input id="maxDeletes" type="number" min="1" step="1" value="50" />
    </label>
    <label>
      Stop after consecutive errors
      <input id="maxErrors" type="number" min="1" step="1" value="5" />
    </label>
    <div class="actions">
      <button id="start" type="button">Start</button>
      <button id="stop" type="button">Stop</button>
    </div>
    <pre id="status" aria-live="polite"></pre>
    <script src="popup.js" type="module"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>X DM cleanup</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>X DM cleanup</h1>
    <p class="hint">Open a DM conversation on x.com, then use the controls below.</p>
    <label>
      Min delay (ms)
      <input id="minDelay" type="number" min="200" step="50" value="800" />
    </label>
    <label>
      Max delay (ms)
      <input id="maxDelay" type="number" min="200" step="50" value="2000" />
    </label>
    <label>
      Max deletes this run
      <input id="maxDeletes" type="number" min="1" step="1" value="50" />
    </label>
    <label>
      Stop after consecutive errors
      <input id="maxErrors" type="number" min="1" step="1" value="5" />
    </label>
    <div class="actions">
      <button id="start" type="button">Start</button>
      <button id="stop" type="button">Stop</button>
    </div>
    <pre id="status" aria-live="polite"></pre>
    <script src="popup.js" type="module"></script>
  </body>
</html>
